services:
  - type: web
    name: saltline
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SALT_DATA
        value: /var/data
    disk:
      name: saltline-data
      mountPath: /var/data
      sizeGB: 1
